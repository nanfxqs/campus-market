name: campus-market-v2
x-app: &app
  build: .
  entrypoint: [/market]
  command: [serve]
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEMORY:-512m}
  depends_on:
    mongo:
      condition: service_healthy
  healthcheck:
    test: [CMD, /validation, health]
    interval: 5s
    timeout: 5s
    retries: 60
x-env: &env
  MONGO_URI: mongodb://mongo:27017/?directConnection=true
  DB_NAME: ${DB_NAME:-campus_v2_experiment}
  REDIS_ADDR: redis:6379
  CACHE_TTL: ${CACHE_TTL:-10m}
  CACHE_TIMEOUT: ${CACHE_TIMEOUT:-100ms}
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0.4@sha256:1ce32a37610486d753a81cc7ca9c719964679e37eb0aa8b4b521578b883d0147
    hostname: mongo
    cpus: ${MONGO_CPUS:-4}
    mem_limit: ${MONGO_MEMORY:-8g}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - search-data:/data/mongot
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7.4.2-bookworm@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    command: [redis-server, --maxmemory, '${REDIS_MAXMEMORY:-128mb}', --maxmemory-policy, '${REDIS_POLICY:-allkeys-lru}', --save, '', --appendonly, 'no']
    cpus: ${REDIS_CPUS:-1}
    mem_limit: ${REDIS_MEMORY:-256m}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 20
  api-a:
    <<: *app
    profiles: [A]
    environment:
      <<: *env
      CACHE_ENABLED: 'false'
    ports: ['127.0.0.1:${API_PORT:-8082}:8080']
  api-b:
    <<: *app
    profiles: [B]
    environment:
      <<: *env
      CACHE_ENABLED: 'true'
    ports: ['127.0.0.1:${API_PORT:-8082}:8080']
  api-c1:
    <<: *app
    profiles: [C]
    environment:
      <<: *env
      CACHE_ENABLED: 'true'
  api-c2:
    <<: *app
    profiles: [C]
    depends_on:
      mongo:
        condition: service_healthy
      api-c1:
        condition: service_healthy
    environment:
      <<: *env
      CACHE_ENABLED: 'true'
  nginx:
    profiles: [C]
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    cpus: ${NGINX_CPUS:-1}
    mem_limit: ${NGINX_MEMORY:-128m}
    ports: ['127.0.0.1:${API_PORT:-8082}:8080']
    volumes:
      - ./deploy/nginx-v2.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-c1:
        condition: service_healthy
      api-c2:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 5s
      retries: 60
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    working_dir: /src
    environment:
      <<: *env
      API_URL: http://api-b:8080
    entrypoint: [go]
volumes:
  mongo-data:
  mongo-config:
  search-data:
