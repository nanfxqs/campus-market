name: campus-v2-functions22
services:
  mongo:
    cpus: 4
    hostname: mongo
    image: mongodb/mongodb-atlas-local:8.0.4@sha256:1ce32a37610486d753a81cc7ca9c719964679e37eb0aa8b4b521578b883d0147
    mem_limit: "8589934592"
    networks:
      default: null
    volumes:
      - type: volume
        source: mongo-data
        target: /data/db
        volume: {}
      - type: volume
        source: mongo-config
        target: /data/configdb
        volume: {}
      - type: volume
        source: search-data
        target: /data/mongot
        volume: {}
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'
      timeout: 5s
      interval: 5s
      retries: 60
  redis:
    cpus: 1
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - 'no'
    image: redis:7.4.2-bookworm@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
    mem_limit: "268435456"
    networks:
      default: null
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 2s
      interval: 5s
      retries: 20
networks:
  default:
    name: campus-v2-functions22_default
volumes:
  mongo-config:
    name: campus-v2-functions22_mongo-config
  mongo-data:
    name: campus-v2-functions22_mongo-data
  search-data:
    name: campus-v2-functions22_search-data
x-app:
  build: .
  command:
    - serve
  cpus: "2"
  depends_on:
    mongo:
      condition: service_healthy
  entrypoint:
    - /market
  healthcheck:
    interval: 5s
    retries: 60
    test:
      - CMD
      - /validation
      - health
    timeout: 5s
  mem_limit: 512m
x-env:
  CACHE_TIMEOUT: 100ms
  CACHE_TTL: 10m
  DB_NAME: campus_v2_experiment
  MONGO_URI: mongodb://mongo:27017/?directConnection=true
  REDIS_ADDR: redis:6379
