worker_processes 1;
events { worker_connections 1024; }
http {
    log_format distribution '$time_iso8601 request="$request" status=$status upstream=$upstream_addr upstream_status=$upstream_status request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout distribution;
    error_log /dev/stderr warn;
    upstream gin {
        # Default round robin, no sticky cookie or IP hash.
        server api-c1:8080;
        server api-c2:8080;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://gin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Never retry writes against another instance after an upstream error.
            proxy_next_upstream off;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
